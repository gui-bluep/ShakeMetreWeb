# ShakeMetre, monté sous /metre du serveur FileMaker.
#
# Ce fichier est inclus par la configuration nginx de FileMaker Server, dans son bloc
# `server { listen 443 ... }`. Il vit ici plutôt que là-bas pour deux raisons : il est
# versionné avec le code qu'il sert, et il se modifie sans sudo — une mise à jour de FMS
# qui réécrit fms_nginx.conf ne coûte alors qu'une ligne d'`include` à remettre.
#
# `root` pointe sur ~/webroot, dont le segment `metre` est un lien symbolique vers public/.
# C'est ce qui permet un `root` ordinaire là où un `alias` casserait `try_files` (piège
# connu de nginx), et c'est ce qui fait arriver SCRIPT_NAME=/metre/index.php à PHP — la
# valeur dont Laravel déduit sa base d'URL, et donc tout le préfixe côté serveur.

location ^~ /metre {
    root /home/mycloud/webroot;
    index index.php;

    try_files $uri $uri/ /metre/index.php?$query_string;

    # Les assets sont nommés par empreinte (Vite) : immuables, donc cachables sans risque.
    # `expires` seul, sans add_header, pour ne pas annuler les en-têtes de sécurité que le
    # bloc server de FMS ajoute (un add_header imbriqué remplace ceux hérités).
    location ~ ^/metre/build/ {
        root /home/mycloud/webroot;
        expires 1y;
        access_log off;
    }

    location ~ ^/metre/.*\.php$ {
        root /home/mycloud/webroot;

        include "/etc/nginx/fastcgi_params";
        fastcgi_pass 127.0.0.1:9000;          # php-fpm de brew, service utilisateur mycloud
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTPS on;

        # Les sept documents imprimés passent par dompdf : plusieurs secondes sur un gros métré.
        fastcgi_read_timeout 120s;
    }
}
